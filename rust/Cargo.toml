[package]
name = "zwrt-datad"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
default-run = "zwrt-datad"

[features]
# `mesh` is the WebRTC direct data path (docs/MESH.md). Builds that cannot afford
# the extra ~2.5 MB turn it off with --no-default-features; the daemon then simply
# never advertises the mesh capabilities.
default = ["mesh"]
mesh = ["dep:str0m"]
keymaster-worker = []

[[bin]]
name = "zwrt-datad"
path = "src/main.rs"

[[bin]]
name = "keymaster-worker"
path = "keymaster_worker.rs"
required-features = ["keymaster-worker"]

[dependencies]
anyhow = "1"
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"], optional = true }
aes-gcm = "0.10"
axum = { version = "0.8", features = ["http1", "json", "query", "tokio", "ws"] }
base64 = "0.22"
bzip2 = { version = "=0.5.2", features = ["static"] }
flate2 = { version = "=1.1.8", default-features = false, features = ["rust_backend"] }
lzma-rs = "=0.3.0"
crc32fast = "=1.5.2"
tar = { version = "=0.4.45", default-features = false }
xz2 = { version = "=0.1.7", features = ["static"] }
zip = { version = "=2.4.2", default-features = false, features = ["deflate", "bzip2"] }
clap = { version = "4", features = ["derive", "env"] }
ed25519-dalek = "2"
futures-util = "0.3"
fs2 = "0.4"
httpdate = "1"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rsa = "0.9"
rand = "0.8"
ring = "0.17"
rumqttc = { package = "rumqttc-v4-next", version = "0.34", default-features = false, features = ["use-rustls-ring", "websocket"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
webpki-roots = "1"
zeroize = "1"

[dev-dependencies]
rcgen = "0.13"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"
