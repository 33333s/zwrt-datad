name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  u50get-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y binutils-arm-linux-gnueabihf
      - run: sh tools/u50get/build.sh
      - run: python3 tests/u50pro_download_test.py
  u50pro-go-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - run: go test ./...
        working-directory: tools/u50pro-installer
      - run: GOOS=linux GOARCH=arm GOARM=7 CGO_ENABLED=0 go build -o "$RUNNER_TEMP/install-datad-armv7" .
        working-directory: tools/u50pro-installer
  rust:
    # Fork PRs stay on disposable GitHub-hosted machines.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "linux", "x64", "datad-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 4
      RUST_CONTROL_PORT: 29460
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --locked
      - run: python3 ../tests/u50_candidate_test.py target/debug/zwrt-datad
      - run: python3 ../tests/u50_platform_test.py target/debug/zwrt-datad
      - run: python3 ../tests/ota_app_test.py target/debug/zwrt-datad
      - run: python3 ../tests/u50_installer_test.py
      - run: python3 ../tests/u50pro_deploy_test.py
      - run: python3 ../tests/u50pro_download_test.py
      - name: Prepare isolated Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/datad-python"
          echo "$RUNNER_TEMP/datad-python/bin" >> "$GITHUB_PATH"
      - run: python3 -m pip install 'cryptography>=43,<49'
      - run: python3 ../tests/rust_sms_test.py target/debug/zwrt-datad
      - run: python3 ../tests/rust_usb_test.py target/debug/zwrt-datad
      - run: python3 ../tests/identity_test.py target/debug/zwrt-datad
      - run: python3 ../tests/installer_test.py
      - run: python3 ../tests/rust_webshell_test.py target/debug/zwrt-datad
      - run: python3 ../tests/rust_webshell_memory_test.py target/debug/zwrt-datad
      - run: python3 ../tests/rust_sse_limit_test.py target/debug/zwrt-datad
      - run: sh ../tests/service_token_test.sh target/debug/zwrt-datad
      - run: python3 ../tests/neighbor_parser_test.py target/debug/zwrt-datad
      - run: python3 ../tests/version_test.py target/debug/zwrt-datad
      - run: python3 ../tests/lan_cors_test.py target/debug/zwrt-datad
      - run: python3 ../tests/signal_auth_test.py target/debug/zwrt-datad
      - run: python3 ../tests/cloud_embedded_test.py target/debug/zwrt-datad
      - run: python3 ../tests/cloud_app_test.py target/debug/zwrt-datad
      - run: python3 ../tests/sms_forward_app_test.py target/debug/zwrt-datad
      - run: python3 ../tests/tasks_app_test.py target/debug/zwrt-datad
      - run: python3 ../tests/lan_history_app_test.py target/debug/zwrt-datad
      - run: python3 ../tests/automation_app_test.py target/debug/zwrt-datad
      - run: python3 ../tests/neighbor_http_test.py target/debug/zwrt-datad
      - run: python3 ../tests/direct_supply_test.py target/debug/zwrt-datad
      - run: python3 ../tests/wifi_control_test.py target/debug/zwrt-datad
      - run: ../tests/rust_control_integration.sh
      - run: python3 ../tests/rust_cooling_test.py target/debug/zwrt-datad
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --features keymaster-worker --bin keymaster-worker -- -D warnings
      - run: cargo build --locked --release
