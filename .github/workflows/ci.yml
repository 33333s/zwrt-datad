name: ci

on:
  # A PR is tested once (pull_request); pushes are only tested on main and on
  # release tags, so the single self-hosted runner no longer runs every commit twice.
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    # Fork PRs stay on disposable GitHub-hosted machines.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "linux", "x64", "datad-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 14
      RUST_CONTROL_PORT: 29460
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The self-hosted runner keeps the build cache between jobs: checkout removes
      # the untracked `target` link, so point it at the persistent directory again
      # and start over once the cache is large.
      - name: Persistent build cache (self-hosted runner only)
        if: runner.environment == 'self-hosted'
        working-directory: rust
        run: |
          cache=/var/lib/datad-ci/cargo-target
          mkdir -p "$cache"
          if [ "$(du -sm "$cache" | cut -f1)" -gt 12000 ]; then rm -rf "$cache"/* "$cache"/.[!.]* 2>/dev/null || true; fi
          ln -sfn "$cache" target
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Prepare isolated Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/datad-python"
          echo "$RUNNER_TEMP/datad-python/bin" >> "$GITHUB_PATH"
      - run: python3 -m pip install 'cryptography>=43,<49'
      - run: python3 ../tests/rust_sms_test.py target/debug/zwrt-datad
      - run: python3 ../tests/rust_usb_test.py target/debug/zwrt-datad
      - run: python3 ../tests/battery_absent_test.py target/debug/zwrt-datad
      - run: python3 ../tests/mc8531_template_test.py target/debug/zwrt-datad
      - run: python3 ../tests/rust_apn_session_test.py target/debug/zwrt-datad
      - run: python3 ../tests/identity_test.py target/debug/zwrt-datad
      - run: python3 ../tests/installer_test.py
      - run: python3 ../tests/rust_webshell_test.py target/debug/zwrt-datad
      - run: python3 ../tests/rust_webshell_memory_test.py target/debug/zwrt-datad
      - run: python3 ../tests/rust_sse_limit_test.py target/debug/zwrt-datad
      - run: sh ../tests/service_token_test.sh target/debug/zwrt-datad
      - run: sh ../tests/service_start_race_test.sh target/debug/zwrt-datad
      - run: python3 ../tests/neighbor_parser_test.py target/debug/zwrt-datad
      - run: python3 ../tests/version_test.py target/debug/zwrt-datad
      - run: python3 ../tests/time_control_test.py target/debug/zwrt-datad
      - run: python3 ../tests/cloud_embedded_test.py target/debug/zwrt-datad
      - run: python3 ../tests/neighbor_http_test.py target/debug/zwrt-datad
      - run: python3 ../tests/neighbor_lte_test.py target/debug/zwrt-datad
      - run: python3 ../tests/direct_supply_test.py target/debug/zwrt-datad
      - run: python3 ../tests/wifi_control_test.py target/debug/zwrt-datad
      - run: ../tests/rust_control_integration.sh
      - run: python3 ../tests/rust_cooling_test.py target/debug/zwrt-datad
      - name: Integration suites over the ubus socket protocol
        run: |
          for suite in rust_sms_test.py rust_usb_test.py rust_apn_session_test.py identity_test.py \
                       rust_webshell_test.py rust_sse_limit_test.py version_test.py time_control_test.py \
                       cloud_embedded_test.py neighbor_http_test.py direct_supply_test.py wifi_control_test.py; do
            sh ../tests/with_mock_ubusd.sh python3 "../tests/$suite" target/debug/zwrt-datad
          done
          sh ../tests/with_mock_ubusd.sh sh ../tests/service_token_test.sh target/debug/zwrt-datad
          sh ../tests/with_mock_ubusd.sh ../tests/rust_control_integration.sh
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --features keymaster-worker --bin keymaster-worker -- -D warnings
      # The LTO release build is one long single-threaded link; releases are built
      # on the build machine anyway, so a PR only needs it on main and tags.
      - if: github.event_name != 'pull_request'
        run: cargo build --locked --release
